spring.application.name=customer-service
server.port=${SERVER_PORT:8091}
spring.datasource.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/bancoxyz_customers}
spring.datasource.username=${CUSTOMER_DB_USERNAME:bancoxyz_customer}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.clean-disabled=true
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:https://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=customer-service
server.shutdown=graceful
